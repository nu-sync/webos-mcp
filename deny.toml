# Dependency policy checked in CI with `cargo deny check`.

[advisories]
version = 2
ignore = [
    # `rsa` leaks private-key timing (Marvin). This program never holds an RSA
    # private key: SSH signing is delegated to the user's agent, and `rsa` is
    # reached only through `russh` to verify signatures. No fixed release
    # exists yet; remove this entry when `russh` moves to a patched `rsa`.
    { id = "RUSTSEC-2023-0071", reason = "no RSA private-key operations; signing is delegated to the SSH agent" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "Unlicense",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
