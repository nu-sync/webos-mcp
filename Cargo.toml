[package]
name = "webos-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "3.8.0", features = ["transport-io", "schemars"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
rpassword = "7"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "time", "io-util", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.28"
sha2 = "0.10"
futures-util = { version = "0.3", features = ["sink"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
png = "0.18"
base64 = "0.22"
url = "2"
fs2 = "0.4"
directories = "6"
tempfile = "3"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[dev-dependencies]
rcgen = "0.14"
rmcp = { version = "3.8.0", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "io-util"] }
